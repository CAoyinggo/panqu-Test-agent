# GitLab CI 流水线：MR / main 分支自动触发回归测试 + 安全扫描
# 使用方式：将此文件提交到仓库根目录即可自动生效
# 需要 CI/CD Variables（Settings → CI/CD → Variables）：
#   TESTFLOW_COOKIE             - test 环境 cookie_string
#   TESTFLOW_PROJECT_ID          - test 环境 project_id
#   TESTFLOW_ACCOUNT             - 账号名（可选）
#   TESTFLOW_BASE_URL            - API 基础地址（可选，覆盖 environments.json）
#   TESTFLOW_SUBMIT_URL          - 提交接口路径（可选）
#   TESTFLOW_STATUS_URL          - 状态查询接口路径（可选）
#   TESTFLOW_DETAIL_URL          - 详情接口路径（可选）
#   TESTFLOW_BILLING_URL         - 计费接口路径（可选）
#   TESTFLOW_CSRF_PAGE           - CSRF 页面路径（可选）
#   TESTFLOW_FEISHU_WEBHOOK      - 飞书通知 webhook（可选）
#   TESTFLOW_FEISHU_MENTION      - 飞书 @ 手机号，逗号分隔（可选）
#   TESTFLOW_OSS_ENDPOINT        - OSS endpoint（如需上传报告）
#   TESTFLOW_OSS_BUCKET          - OSS bucket
#   TESTFLOW_OSS_ACCESS_KEY_ID   - OSS AK
#   TESTFLOW_OSS_ACCESS_KEY_SECRET - OSS SK
#   TESTFLOW_REPORT_BASE_URL     - 报告公开访问前缀
# ── 发布部署 Variables ──
#   TESTFLOW_DEPLOY_SSH_KEY      - 测试服务器 SSH 私钥（deploy 阶段）
#   TESTFLOW_DEPLOY_HOST         - 测试服务器地址
#   TESTFLOW_DEPLOY_USER         - SSH 用户名（默认 root）
#   TESTFLOW_DEPLOY_HOST_KEY     - 测试服务器 SSH host key（可选）

stages:
  - build
  - test
  - deploy

variables:
  NODE_ENV: "production"

# ── 构建阶段：安装依赖 + 编译 TypeScript ──
build:
  stage: build
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ════════════════════════════════════════════
# 测试阶段（所有 job 并行执行）
# ════════════════════════════════════════════

# ── 回归测试 ──
test:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm run build
    - node dist/bin/run-test.js --task src/cases --ci --upload-reports
    # 生成 Allure HTML 报告（不阻塞流水线）
    - bash scripts/ci/generate-allure-html.sh || echo "⚠ Allure HTML 生成跳过"
  artifacts:
    paths: [output/]
    reports:
      junit: output/**/junit.xml
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 手动触发：单功能调试（仅 web 触发，需手动点击） ──
test:wan3:
  stage: test
  image: node:20-alpine
  needs: [build]
  script:
    - npm run build
    - node dist/bin/run-test.js --task src/cases/wan3 --func wan3 --ci --upload-reports
  artifacts:
    paths: [output/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

# ════════════════════════════════════════════
# 安全扫描（与 test 并行执行，不延长流水线）
# ════════════════════════════════════════════

# ── 1. 依赖漏洞扫描（npm audit） ──
security:audit:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm ci
    - bash scripts/security/audit.sh
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 2. 代码安全扫描（SAST - Semgrep） ──
security:sast:
  stage: test
  image: returntocorp/semgrep:latest
  needs: []
  script:
    - semgrep --config config/security/semgrep.yml --sarif --output security-reports/semgrep.sarif . || true
    - semgrep --config config/security/semgrep.yml --json --output security-reports/semgrep.json . || true
    - |
      ERROR_COUNT=$(grep -o '"severity": "ERROR"' security-reports/semgrep.json 2>/dev/null | wc -l || echo "0")
      echo "Semgrep 扫描完成：$ERROR_COUNT 个 ERROR 级别问题"
      if [ "$ERROR_COUNT" -gt 0 ]; then
        echo "❌ 检测到硬编码密钥或严重安全问题"
        exit 1
      fi
      echo "✅ SAST 扫描通过"
  artifacts:
    paths: [security-reports/]
    reports:
      sast: security-reports/semgrep.sarif
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 3. 密钥泄露扫描（Gitleaks） ──
security:secrets:
  stage: test
  image: zricethezav/gitleaks:latest
  needs: []
  script:
    - mkdir -p security-reports
    - gitleaks detect --config config/security/gitleaks.toml --report-format json --report-path security-reports/gitleaks.json --source . || true
    - |
      LEAK_COUNT=$(node -e "try{const r=require('./security-reports/gitleaks.json');console.log(r.length||0)}catch(e){console.log(0)}" 2>/dev/null || echo "0")
      echo "Gitleaks 扫描完成：$LEAK_COUNT 个密钥泄露"
      if [ "$LEAK_COUNT" -gt 0 ]; then
        echo "❌ 检测到密钥泄露"
        cat security-reports/gitleaks.json
        exit 1
      fi
      echo "✅ 未检测到密钥泄露"
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 4. Docker 镜像漏洞扫描（Trivy） ──
security:trivy:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [build]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    DOCKER_BUILDKIT: "1"
  script:
    - mkdir -p security-reports
    # 扫描 Dockerfile 配置
    - trivy config --format json --output security-reports/trivy-config.json . || true
    # 构建镜像并扫描（需要 Docker-in-Docker 或 Kaniko）
    # CI 环境中若无 Docker daemon，则仅扫描 Dockerfile 配置
    - |
      if command -v docker &>/dev/null; then
        export DOCKER_BUILDKIT=1
        docker build -f deploy/docker/Dockerfile --cache-from=type=local,src=.docker-cache --cache-to=type=local,dest=.docker-cache -t test-flow:ci-scan .
        trivy image --exit-code 1 --severity HIGH,CRITICAL --format json --output security-reports/trivy-image.json test-flow:ci-scan
        echo "✅ 镜像扫描完成（无 HIGH/CRITICAL 漏洞）"
      else
        echo "⚠ Docker 不可用，仅扫描 Dockerfile 配置"
        echo "请在有 Docker 环境的 Runner 上执行完整镜像扫描"
      fi
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  cache:
    key: trivy-db-${CI_COMMIT_REF_SLUG}
    paths:
      - .trivycache/
      - .docker-cache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 5. License 合规扫描 ──
security:license:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm ci
    - bash scripts/security/license-check.sh
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  allow_failure: true  # GPL 仅警告，不阻塞
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ════════════════════════════════════════════
# 自治发布门禁（Phase 23.4）
# 统一 Release Contract + CI Exit Code：
#   0=PASS → 继续发布
#   1=BLOCK → 阻断（job 失败，release:image 不会启动）
#   2=REVIEW → 阻断（job 失败并提示人工评审；REVIEW 绝不返回 0）
#   3=SYSTEM_ERROR → 阻断
# Deterministic First：决策由规则引擎推导，不调用 LLM。
# ════════════════════════════════════════════
agent-release-gate:
  stage: deploy
  image: node:20-alpine
  needs:
    - test
    - security:audit
    - security:sast
    - security:secrets
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm run build
    - npm run agent:preflight
    - npm run agent:autonomous:test
    - npm run agent:portfolio-regression:test
    - npm run agent:exploration-regression:test
    - npm run agent:replan:test
    - npm run agent:release-ci:test
    - |
      set +e
      node scripts/ci/agent-release-gate.mjs --feature "${CI_COMMIT_REF_NAME}"
      GATE_EXIT=$?
      set -e
      echo "GATE_EXIT=$GATE_EXIT"
      if [ "$GATE_EXIT" -eq 0 ]; then
        echo "✅ 发布决策：PASS"
      elif [ "$GATE_EXIT" -eq 1 ]; then
        echo "❌ 发布决策：BLOCK（阻断发布，需修复后重新运行流水线）"
        exit 1
      elif [ "$GATE_EXIT" -eq 2 ]; then
        echo "⚠️ 发布决策：REVIEW（需人工评审，阻断发布。请评审 release-decision.json 后修复或人工批准后重跑）"
        exit 2
      else
        echo "❌ 发布决策：SYSTEM_ERROR（检查环境与依赖后重试）"
        exit 3
      fi
  artifacts:
    paths: [output/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ════════════════════════════════════════════
# 发布部署阶段（main 分支 / vX.Y.Z tag 触发）
# 安全门禁 + 自治发布门禁全通过 → 构建推送镜像 → SBOM → 部署 → 通知
# ════════════════════════════════════════════

# ── 1. 构建并推送镜像到 GitLab Container Registry ──
release:image:
  stage: deploy
  image: docker:24-cli
  services:
    - docker:24-dind
  needs:
    - security:audit
    - security:sast
    - security:secrets
    - security:trivy
    - security:license
    - test
    - agent-release-gate
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - mkdir -p security-reports
    # 登录 GitLab Container Registry
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # 确定镜像 tag
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="latest"
      fi
      echo "镜像 tag: $IMAGE_TAG"
    # 构建镜像（复用 BuildKit 缓存）
    - export DOCKER_BUILDKIT=1
    - docker build -f deploy/docker/Dockerfile -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # 推送镜像
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "$CI_REGISTRY_IMAGE:$IMAGE_TAG" > security-reports/published-image.txt
    - echo "✅ 镜像已推送: $CI_REGISTRY_IMAGE:$IMAGE_TAG"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always

# ── 2. 生成 SBOM（软件物料清单） ──
release:sbom:
  stage: deploy
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [release:image]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - mkdir -p security-reports
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="latest"
      fi
    - trivy image --format cyclonedx --output security-reports/sbom.json "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - echo "✅ SBOM 已生成: security-reports/sbom.json"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always

# ── 3. 部署到测试环境 + 冒烟测试 ──
release:deploy:
  stage: deploy
  image: alpine:latest
  needs: [release:sbom]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$TESTFLOW_DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - |
      if [ -n "$TESTFLOW_DEPLOY_HOST_KEY" ]; then
        echo "$TESTFLOW_DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
      else
        ssh-keyscan -H "$TESTFLOW_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export DEPLOY_IMAGE=$(cat security-reports/published-image.txt)
    - export DEPLOY_HOST="${TESTFLOW_DEPLOY_HOST:?TESTFLOW_DEPLOY_HOST not set}"
    - export DEPLOY_USER="${TESTFLOW_DEPLOY_USER:-root}"
    - export REGISTRY="$CI_REGISTRY"
    - export REGISTRY_USER="$CI_REGISTRY_USER"
    - export REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - |
      echo "部署镜像: $DEPLOY_IMAGE"
      echo "目标主机: $DEPLOY_USER@$DEPLOY_HOST"
    # 通过 SSH 在测试服务器上执行部署脚本
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" \
      DEPLOY_IMAGE="$DEPLOY_IMAGE" \
      REGISTRY="$REGISTRY" \
      REGISTRY_USER="$REGISTRY_USER" \
      REGISTRY_PASSWORD="$REGISTRY_PASSWORD" \
      "bash -s" < scripts/deploy/deploy.sh
    - echo "✅ 部署完成"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always

# ── 4. 发布通知（飞书） ──
release:notify:
  stage: deploy
  image: node:20-alpine
  needs:
    - job: release:deploy
      optional: true
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: always
  script:
    - mkdir -p security-reports
    - |
      # 读取部署状态
      if [ -f security-reports/deploy-status.json ]; then
        DEPLOY_STATUS=$(python3 -c "import json; d=json.load(open('security-reports/deploy-status.json')); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
      else
        DEPLOY_STATUS="not_deployed"
      fi
      # 判断发布状态
      if [ "$DEPLOY_STATUS" = "success" ]; then
        export RELEASE_STATUS="success"
      elif [ "$DEPLOY_STATUS" = "rollback" ] || [ "$DEPLOY_STATUS" = "rollback_no_previous" ]; then
        export RELEASE_STATUS="rollback"
      else
        export RELEASE_STATUS="failure"
        export FAILED_STAGE="deploy"
      fi
      # 读取推送的镜像
      if [ -f security-reports/published-image.txt ]; then
        export RELEASE_IMAGE=$(cat security-reports/published-image.txt)
      else
        export RELEASE_IMAGE="${CI_REGISTRY_IMAGE:-unknown}"
      fi
      # 确定镜像 tag
      if [ -n "$CI_COMMIT_TAG" ]; then
        export RELEASE_TAG="$CI_COMMIT_TAG"
      else
        export RELEASE_TAG="latest"
      fi
      # GitLab CI 自动提供：CI_COMMIT_SHA, CI_COMMIT_MESSAGE, CI_PIPELINE_ID, CI_PIPELINE_URL
      # 飞书 webhook 从 TESTFLOW_FEISHU_WEBHOOK 读取
      export FEISHU_WEBHOOK="${TESTFLOW_FEISHU_WEBHOOK:-}"
      export DEPLOY_ENV="test"
      export SMOKE_RESULT="$DEPLOY_STATUS"
      # 发送通知
      node scripts/deploy/notify-feishu.mjs || echo "⚠ 通知发送失败，不阻塞流水线"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always
