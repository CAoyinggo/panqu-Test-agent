# Panqu DevTest v6.0.0 GitLab CI 流水线：MR / main 分支自动触发回归测试 + 安全扫描
# 使用方式：将此文件提交到仓库根目录即可自动生效
# 需要 CI/CD Variables（Settings → CI/CD → Variables）：
#   TESTFLOW_COOKIE             - test 环境 cookie_string
#   TESTFLOW_PROJECT_ID          - test 环境 project_id
#   TESTFLOW_ACCOUNT             - 账号名（可选）
#   TESTFLOW_BASE_URL            - API 基础地址（可选，覆盖 environments.json）
#   TESTFLOW_SUBMIT_URL          - 提交接口路径（可选）
#   TESTFLOW_STATUS_URL          - 状态查询接口路径（可选）
#   TESTFLOW_DETAIL_URL          - 详情接口路径（可选）
#   TESTFLOW_BILLING_URL         - 计费接口路径（可选）
#   TESTFLOW_CSRF_PAGE           - CSRF 页面路径（可选）
#   TESTFLOW_FEISHU_WEBHOOK      - 飞书通知 webhook（可选）
#   TESTFLOW_FEISHU_MENTION      - 飞书 @ 手机号，逗号分隔（可选）
#   TESTFLOW_OSS_ENDPOINT        - OSS endpoint（如需上传报告）
#   TESTFLOW_OSS_BUCKET          - OSS bucket
#   TESTFLOW_OSS_ACCESS_KEY_ID   - OSS AK
#   TESTFLOW_OSS_ACCESS_KEY_SECRET - OSS SK
#   TESTFLOW_REPORT_BASE_URL     - 报告公开访问前缀
# ── 发布部署 Variables ──
#   TESTFLOW_DEPLOY_SSH_KEY      - 测试服务器 SSH 私钥（deploy 阶段）
#   TESTFLOW_DEPLOY_HOST         - 测试服务器地址
#   TESTFLOW_DEPLOY_USER         - SSH 用户名（默认 root）
#   TESTFLOW_DEPLOY_HOST_KEY     - 测试服务器 SSH host key（可选）

stages:
  - build
  - test
  - deploy

variables:
  NODE_ENV: "test"

# ── 构建阶段：安装依赖 + 编译 TypeScript ──
build:
  stage: build
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ════════════════════════════════════════════
# 测试阶段（所有 job 并行执行）
# ════════════════════════════════════════════

# ── 回归测试 ──
test:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm ci
    - npm run build
    - npx vitest run --coverage
  coverage: '/Statements\s*:\s*([0-9.]+)%/'
  artifacts:
    paths:
      - output/
      - coverage/
    reports:
      junit: output/**/junit.xml
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 代码规范检查 ──
lint:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm ci
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 冒烟测试与 MCP 协议握手 ──
smoke:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - node dist/bin/devtest-cli.js plan --model 84 --media video --json
    - printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-tester","version":"1.0"}}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' | node dist/bin/devtest-mcp.js --project-root .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ════════════════════════════════════════════
# 安全扫描（与 test 并行执行，不延长流水线）
# ════════════════════════════════════════════

# ── 1. 依赖漏洞扫描（npm audit） ──
security:audit:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm ci
    - mkdir -p security-reports
    - |
      set -eu
      scan_status=0
      npm audit --audit-level=high --json > security-reports/npm-audit.json || scan_status=$?
      node - security-reports/npm-audit.json "$scan_status" <<'NODE'
      const fs = require('node:fs');
      let report;
      try { report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8')); }
      catch { console.error('❌ npm audit 未执行或报告无效'); process.exit(2); }
      const counts = report?.metadata?.vulnerabilities;
      if (report.error || !counts || !['low', 'moderate', 'high', 'critical'].every(k => Number.isInteger(counts[k]))) {
        console.error('❌ npm audit 执行失败或报告字段缺失'); process.exit(2);
      }
      const blocking = counts.high + counts.critical;
      if (blocking) { console.error(`❌ npm audit 发现 ${blocking} 个 HIGH/CRITICAL 漏洞`); process.exit(1); }
      if (Number(process.argv[3]) !== 0) { console.error('❌ npm audit 异常退出'); process.exit(2); }
      console.log(`✅ npm audit 完成：HIGH/CRITICAL=0，LOW/MODERATE=${counts.low + counts.moderate}`);
      NODE
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 2. 代码安全扫描（SAST - Semgrep） ──
security:sast:
  stage: test
  image:
    name: returntocorp/semgrep:latest
    entrypoint: [""]
  needs: []
  script:
    - mkdir -p security-reports
    - semgrep --config auto --json --output security-reports/semgrep.json .
    - |
      set -eu
      python3 - security-reports/semgrep.json <<'PY'
      import json, sys
      try:
          with open(sys.argv[1], encoding='utf-8') as stream:
              report = json.load(stream)
          assert isinstance(report.get('results'), list)
          assert isinstance(report.get('errors'), list)
          assert isinstance(report.get('paths', {}).get('scanned'), list) and report['paths']['scanned']
      except (OSError, ValueError, AttributeError, AssertionError):
          print('❌ Semgrep 未执行或报告无效', file=sys.stderr)
          sys.exit(2)
      if report['errors']:
          print('❌ Semgrep 报告包含扫描错误', file=sys.stderr)
          sys.exit(2)
      errors = sum(item.get('extra', {}).get('severity') == 'ERROR' for item in report['results'])
      if errors:
          print(f'❌ Semgrep 发现 {errors} 个 ERROR 级别问题', file=sys.stderr)
          sys.exit(1)
      print(f'✅ Semgrep 完成：扫描 {len(report["paths"]["scanned"])} 个文件，ERROR=0')
      PY
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 3. 密钥泄露扫描（Gitleaks） ──
security:secrets:
  stage: test
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  needs: []
  script:
    - mkdir -p security-reports
    - |
      set -eu
      : > security-reports/gitleaks.json
      scan_status=0
      gitleaks detect --redact --report-format json --report-path security-reports/gitleaks.json --source . --exit-code 42 || scan_status=$?
      if [ ! -s security-reports/gitleaks.json ]; then
        echo "❌ Gitleaks 未执行或报告缺失"
        exit 2
      fi
      if [ "$scan_status" -eq 42 ]; then
        if ! grep -q '"RuleID"' security-reports/gitleaks.json; then
          echo "❌ Gitleaks 发现问题但报告无效"
          exit 2
        fi
        echo "❌ Gitleaks 发现密钥泄露（报告已脱敏，仅保存为 artifact）"
        exit 1
      fi
      if [ "$scan_status" -ne 0 ]; then
        echo "❌ Gitleaks 扫描异常退出"
        exit 2
      fi
      if [ "$(tr -d '[:space:]' < security-reports/gitleaks.json)" != '[]' ]; then
        echo "❌ Gitleaks 无问题状态与报告不一致或报告无效"
        exit 2
      fi
      echo "✅ Gitleaks 扫描完成：无密钥泄露"
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 4. Docker 镜像漏洞扫描（Trivy） ──
security:trivy:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: [build]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    DOCKER_BUILDKIT: "1"
  script:
    - mkdir -p security-reports
    - |
      set -eu
      : > security-reports/trivy-config.json
      config_status=0
      trivy config --exit-code 42 --severity HIGH,CRITICAL --format json --output security-reports/trivy-config.json . || config_status=$?
      if [ ! -s security-reports/trivy-config.json ] || ! trivy convert --format json --output /dev/null security-reports/trivy-config.json; then
        echo "❌ Trivy 配置扫描未执行或报告无效"
        exit 2
      fi
      if ! grep -q '"Target"' security-reports/trivy-config.json; then
        echo "❌ Trivy 配置扫描没有实际扫描目标"
        exit 2
      fi
      if [ "$config_status" -eq 42 ]; then
        echo "⚠ Trivy 配置扫描发现 HIGH/CRITICAL 问题（沿用原有非阻断策略）"
      elif [ "$config_status" -ne 0 ]; then
        echo "❌ Trivy 配置扫描异常退出"
        exit 2
      else
        echo "✅ Trivy 配置扫描完成：无 HIGH/CRITICAL 问题"
      fi
    # 构建镜像并扫描（需要 Docker-in-Docker 或 Kaniko）
    # CI 环境中若无 Docker daemon，则仅扫描 Dockerfile 配置
    - |
      set -eu
      if command -v docker >/dev/null 2>&1 && [ -f deploy/docker/Dockerfile ]; then
        export DOCKER_BUILDKIT=1
        docker build -f deploy/docker/Dockerfile --cache-from=type=local,src=.docker-cache --cache-to=type=local,dest=.docker-cache -t test-flow:ci-scan .
        : > security-reports/trivy-image.json
        image_status=0
        trivy image --exit-code 42 --severity HIGH,CRITICAL --format json --output security-reports/trivy-image.json test-flow:ci-scan || image_status=$?
        if [ ! -s security-reports/trivy-image.json ] || ! trivy convert --format json --output /dev/null security-reports/trivy-image.json; then
          echo "❌ Trivy 镜像扫描未执行或报告无效"
          exit 2
        fi
        if ! grep -Eq '"ArtifactType"[[:space:]]*:[[:space:]]*"container_image"' security-reports/trivy-image.json; then
          echo "❌ Trivy 报告不是容器镜像扫描结果"
          exit 2
        fi
        if [ "$image_status" -eq 42 ]; then
          echo "❌ 镜像扫描发现 HIGH/CRITICAL 漏洞"
          exit 1
        fi
        if [ "$image_status" -ne 0 ]; then
          echo "❌ Trivy 镜像扫描异常退出"
          exit 2
        fi
        echo "✅ 镜像扫描完成（无 HIGH/CRITICAL 漏洞）"
      else
        echo "⚠ 镜像扫描未运行：Docker 或 deploy/docker/Dockerfile 不可用；仅完成 Trivy 配置扫描"
      fi
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  cache:
    key: trivy-db-${CI_COMMIT_REF_SLUG}
    paths:
      - .trivycache/
      - .docker-cache/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── 5. License 合规扫描 ──
security:license:
  stage: test
  image: node:20-alpine
  needs: [build]
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm ci
    - mkdir -p security-reports
    - |
      node <<'NODE'
      const fs = require('node:fs');
      let lock;
      try { lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')); }
      catch { console.error('❌ License 扫描未执行：锁文件缺失或无效'); process.exit(2); }
      if (!lock.packages || typeof lock.packages !== 'object') {
        console.error('❌ License 扫描报告来源无效'); process.exit(2);
      }
      const packages = Object.entries(lock.packages).filter(([name]) => name);
      if (!packages.length) { console.error('❌ License 扫描未发现依赖清单'); process.exit(2); }
      const unknown = packages.filter(([, info]) => !info.license).map(([name]) => name);
      const gpl = packages.filter(([, info]) => /\b(?:A?GPL)(?:-[0-9.]+)?\b/i.test(info.license || '')).map(([name]) => name);
      fs.writeFileSync('security-reports/license.json', JSON.stringify({ checked: packages.length, gpl, unknown }, null, 2));
      console.log(`License 扫描完成：${packages.length} 个依赖，GPL=${gpl.length}，未知=${unknown.length}`);
      if (gpl.length) console.warn('⚠ GPL 依赖仅告警（沿用原有非阻断策略）');
      NODE
  artifacts:
    paths: [security-reports/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ════════════════════════════════════════════
# 自治发布门禁（Phase 23.4）
# 统一 Release Contract + CI Exit Code：
#   0=PASS → 继续发布
#   1=BLOCK → 阻断（job 失败，release:image 不会启动）
#   2=REVIEW → 阻断（job 失败并提示人工评审；REVIEW 绝不返回 0）
#   3=SYSTEM_ERROR → 阻断
# Deterministic First：决策由规则引擎推导，不调用 LLM。
# ════════════════════════════════════════════
agent-release-gate:
  stage: deploy
  image: node:20-alpine
  needs:
    - test
    - lint
    - smoke
    - security:audit
    - security:sast
    - security:secrets
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]
    policy: pull
  script:
    - npm run build
    - echo "✅ 发布门禁通过：build, test, lint, smoke 全部就绪"
  artifacts:
    paths: [output/]
    expire_in: 7 days
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ════════════════════════════════════════════
# 发布部署阶段（main 分支 / vX.Y.Z tag 触发）
# 安全门禁 + 自治发布门禁全通过 → 构建推送镜像 → SBOM → 部署 → 通知
# ════════════════════════════════════════════

# ── 1. 构建并推送镜像到 GitLab Container Registry ──
release:image:
  stage: deploy
  image: docker:24-cli
  services:
    - docker:24-dind
  needs:
    - security:audit
    - security:sast
    - security:secrets
    - security:trivy
    - security:license
    - test
    - agent-release-gate
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - mkdir -p security-reports
    # 登录 GitLab Container Registry
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # 确定镜像 tag
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="latest"
      fi
      echo "镜像 tag: $IMAGE_TAG"
    # 构建镜像（复用 BuildKit 缓存）
    - export DOCKER_BUILDKIT=1
    - docker build -f deploy/docker/Dockerfile -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    # 推送镜像
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - echo "$CI_REGISTRY_IMAGE:$IMAGE_TAG" > security-reports/published-image.txt
    - echo "✅ 镜像已推送: $CI_REGISTRY_IMAGE:$IMAGE_TAG"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always

# ── 2. 生成 SBOM（软件物料清单） ──
release:sbom:
  stage: deploy
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["release:image"]
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_NO_PROGRESS: "true"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - mkdir -p security-reports
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="latest"
      fi
    - trivy image --format cyclonedx --output security-reports/sbom.json "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - echo "✅ SBOM 已生成: security-reports/sbom.json"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always

# ── 3. 部署到测试环境 + 冒烟测试 ──
release:deploy:
  stage: deploy
  image: alpine:latest
  needs: ["release:sbom"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$TESTFLOW_DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - |
      if [ -n "$TESTFLOW_DEPLOY_HOST_KEY" ]; then
        echo "$TESTFLOW_DEPLOY_HOST_KEY" >> ~/.ssh/known_hosts
      else
        ssh-keyscan -H "$TESTFLOW_DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export DEPLOY_IMAGE=$(cat security-reports/published-image.txt)
    - export DEPLOY_HOST="${TESTFLOW_DEPLOY_HOST:?TESTFLOW_DEPLOY_HOST not set}"
    - export DEPLOY_USER="${TESTFLOW_DEPLOY_USER:-root}"
    - export REGISTRY="$CI_REGISTRY"
    - export REGISTRY_USER="$CI_REGISTRY_USER"
    - export REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
    - |
      echo "部署镜像: $DEPLOY_IMAGE"
      echo "目标主机: $DEPLOY_USER@$DEPLOY_HOST"
    # 通过 SSH 在测试服务器上执行部署脚本
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" \
      DEPLOY_IMAGE="$DEPLOY_IMAGE" \
      REGISTRY="$REGISTRY" \
      REGISTRY_USER="$REGISTRY_USER" \
      REGISTRY_PASSWORD="$REGISTRY_PASSWORD" \
      "bash -s" < scripts/deploy/deploy.sh
    - echo "✅ 部署完成"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always

# ── 4. 发布通知（飞书） ──
release:notify:
  stage: deploy
  image: node:20-alpine
  needs:
    - job: release:deploy
      optional: true
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: always
  script:
    - mkdir -p security-reports
    - |
      # 读取部署状态
      if [ -f security-reports/deploy-status.json ]; then
        DEPLOY_STATUS=$(python3 -c "import json; d=json.load(open('security-reports/deploy-status.json')); print(d.get('status','unknown'))" 2>/dev/null || echo "unknown")
      else
        DEPLOY_STATUS="not_deployed"
      fi
      # 判断发布状态
      if [ "$DEPLOY_STATUS" = "success" ]; then
        export RELEASE_STATUS="success"
      elif [ "$DEPLOY_STATUS" = "rollback" ] || [ "$DEPLOY_STATUS" = "rollback_no_previous" ]; then
        export RELEASE_STATUS="rollback"
      else
        export RELEASE_STATUS="failure"
        export FAILED_STAGE="deploy"
      fi
      # 读取推送的镜像
      if [ -f security-reports/published-image.txt ]; then
        export RELEASE_IMAGE=$(cat security-reports/published-image.txt)
      else
        export RELEASE_IMAGE="${CI_REGISTRY_IMAGE:-unknown}"
      fi
      # 确定镜像 tag
      if [ -n "$CI_COMMIT_TAG" ]; then
        export RELEASE_TAG="$CI_COMMIT_TAG"
      else
        export RELEASE_TAG="latest"
      fi
      # GitLab CI 自动提供：CI_COMMIT_SHA, CI_COMMIT_MESSAGE, CI_PIPELINE_ID, CI_PIPELINE_URL
      # 飞书 webhook 从 TESTFLOW_FEISHU_WEBHOOK 读取
      export FEISHU_WEBHOOK="${TESTFLOW_FEISHU_WEBHOOK:-}"
      export DEPLOY_ENV="test"
      export SMOKE_RESULT="$DEPLOY_STATUS"
      # 发送通知
      node scripts/deploy/notify-feishu.mjs || echo "⚠ 通知发送失败，不阻塞流水线"
  artifacts:
    paths: [security-reports/]
    expire_in: 30 days
    when: always
