# Agent CI/CD 集成（Phase 20.7）
# 分级执行：
#   - P0/P1 门禁（PR / push main）：快速离线验证核心 Agent 流程（单元 + Mock E2E + 自愈闭环 + CI 六态门禁）
#   - P2/P3 Nightly（每日定时）：全量回归 + 真实 LLM/API E2E（需 Repository Secrets 配置真实环境）
# 六态结果：PASS / FAIL / WARNING / BLOCKED / KNOWN_ISSUE / FLAKY
# 阻断规则：P0 Fail（非已知）→ BLOCKED（阻断发布）；P1 Fail → FAIL；P2/P3 → WARNING（nightly 关注）
# 真实环境开关：默认 RUN_REAL_E2E=false（离线确定性），Nightly 任务设置 RUN_REAL_E2E=true 并注入 Secrets。

name: Agent Test Flow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每日 UTC 18:00（北京时间次日 02:00）执行 P2/P3 全量回归
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  # ===== P0/P1 门禁：PR / push 触发，只跑 P0/P1 级别快速离线验证 =====
  p0-p1-gate:
    name: P0/P1 Gate（单元 + Mock E2E + 六态门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Agent 单元测试（P0/P1 逻辑）
        run: npm run agent:test

      - name: Agent Preflight（上线前环境自检）
        run: npm run agent:preflight

      - name: Agent Mock E2E（离线确定性，覆盖核心链路）
        run: npm run agent:e2e

      - name: Self-Healing 真实场景闭环（Patch → 重执行 → 恢复）
        run: npm run agent:e2e:healing

      - name: 人工 vs Agent 对照实验（30 条需求 × 3 档）
        run: npm run agent:eval:comparison

      - name: CI 六态门禁校验（P0 阻断规则）
        run: node scripts/ci/agent-ci-gate.mjs

      - name: 生成 CI 摘要
        if: always()
        run: bash scripts/ci/github-summary.sh || echo "summary skipped"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-p0-p1-reports-${{ github.run_id }}
          path: output/
          retention-days: 7

  # ===== P2/P3 Nightly：全量回归 + 真实环境验证 =====
  p2-p3-nightly:
    name: P2/P3 Nightly（全量回归 + 真实 E2E）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: 全量单元 + 集成测试（P2/P3 全量）
        run: npm test

      - name: 真实环境 E2E（LLM + API，RUN_REAL_E2E=true）
        env:
          RUN_REAL_E2E: 'true'
          TESTFLOW_COOKIE: ${{ secrets.TESTFLOW_COOKIE }}
          TESTFLOW_PROJECT_ID: ${{ secrets.TESTFLOW_PROJECT_ID }}
          TESTFLOW_ACCOUNT: ${{ secrets.TESTFLOW_ACCOUNT }}
          TESTFLOW_BASE_URL: ${{ secrets.TESTFLOW_BASE_URL }}
          TESTFLOW_SUBMIT_URL: ${{ secrets.TESTFLOW_SUBMIT_URL }}
          TESTFLOW_STATUS_URL: ${{ secrets.TESTFLOW_STATUS_URL }}
          TESTFLOW_DETAIL_URL: ${{ secrets.TESTFLOW_DETAIL_URL }}
          TESTFLOW_BILLING_URL: ${{ secrets.TESTFLOW_BILLING_URL }}
          TESTFLOW_CSRF_PAGE: ${{ secrets.TESTFLOW_CSRF_PAGE }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: npm run agent:e2e:real

      - name: 三档真实评测（Offline / Real LLM / Real API）
        env:
          RUN_REAL_E2E: 'true'
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: npm run agent:eval:real

      - name: Agent Health（运行时健康自检）
        run: npm run agent:health

      - name: Agent Eval 基准（离线 Benchmark）
        run: npm run agent:eval

      - name: 生成 CI 摘要
        if: always()
        run: bash scripts/ci/github-summary.sh || echo "summary skipped"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-p2-p3-reports-${{ github.run_id }}
          path: output/
          retention-days: 14
