name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_test:
        description: 'Deploy the published image to the test environment'
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ════════════════════════════════════════════
  # 安全门禁（发布前置条件）
  # ════════════════════════════════════════════
  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 1. npm audit — 阻塞
      - name: npm audit
        run: bash scripts/security/audit.sh

      # 2. Semgrep SAST — 阻塞（ERROR 级别）
      - name: Semgrep scan
        run: |
          mkdir -p security-reports
          docker run --rm --entrypoint semgrep \
            -v "$PWD:/src" returntocorp/semgrep:latest \
            --config /src/config/security/semgrep.yml \
            --sarif --output /src/security-reports/semgrep.sarif /src

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: security-reports/semgrep.sarif
          category: semgrep

      # 3. Gitleaks — 阻塞
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: config/security/gitleaks.toml

      # 4. License check — 非阻塞
      - name: License check
        run: bash scripts/security/license-check.sh
        continue-on-error: true

  # ════════════════════════════════════════════
  # 构建并推送镜像到 GHCR
  # ════════════════════════════════════════════
  release-image:
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.imgref.outputs.image_ref }}
      digest-ref: ${{ steps.digestref.outputs.digest_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GHCR image reference
        id: imgref
        shell: bash
        run: |
          set -euo pipefail
          # 容器镜像引用必须为小写；统一规范化一次，build/push/SBOM/Trivy/部署全部复用。
          IMAGE_LC=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF="${{ env.REGISTRY }}/${IMAGE_LC}"
          if [[ ! "$REF" =~ ^ghcr\.io/[a-z0-9._-]+(/[a-z0-9._-]+)*$ ]]; then
            echo "::error::normalized image ref is not a valid lowercase container reference: $REF"
            exit 1
          fi
          echo "image_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "image_lc=$IMAGE_LC" >> "$GITHUB_OUTPUT"
          echo "normalized GHCR image ref: $REF"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.imgref.outputs.image_lc }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve digest reference
        id: digestref
        shell: bash
        run: |
          set -euo pipefail
          # 用本次 build 的真实 digest 构造精确引用（image@sha256:...），与 :latest 解耦，
          # 保证 SBOM/Trivy 扫描的就是刚推送的镜像（tag 事件不生成 latest 时也成立）。
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::build digest is empty"
            exit 1
          fi
          if ! printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::build digest has unexpected format: $DIGEST"
            exit 1
          fi
          DIGEST_REF="${{ steps.imgref.outputs.image_ref }}@${DIGEST}"
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          echo "digest reference: $DIGEST_REF"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.digestref.outputs.digest_ref }}
          format: cyclonedx
          output: security-reports/sbom.json

      - name: Save image info
        run: |
          mkdir -p security-reports
          echo "${{ steps.digestref.outputs.digest_ref }}" > security-reports/published-image.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: security-reports/
          retention-days: 30
          if-no-files-found: error

  # ════════════════════════════════════════════
  # CLI 发布资产：打包 packages/panqu-agent-cli 并校验 SHA256
  # 与根镜像发布解耦（独立 job），失败原因独立显示；不影响 deploy-test。
  # ════════════════════════════════════════════
  cli-assets:
    needs: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install CLI dependencies
        working-directory: packages/panqu-agent-cli
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: CLI build (if present)
        working-directory: packages/panqu-agent-cli
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts && require('./package.json').scripts.build ? 0 : 1)"; then
            npm run build
          else
            echo "no build script; plain Node.js ESM — skip"
          fi

      - name: CLI tests
        working-directory: packages/panqu-agent-cli
        run: node --test "tests/*.test.mjs"

      - name: npm pack (capture real tgz name)
        id: pack
        working-directory: packages/panqu-agent-cli
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cli-assets"
          TGZ=$(npm pack --pack-destination "$RUNNER_TEMP/cli-assets" | tail -n1 | tr -d '[:space:]')
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          echo "tgz_path=$RUNNER_TEMP/cli-assets/$TGZ" >> "$GITHUB_OUTPUT"

      - name: Generate and verify SHA256
        working-directory: packages/panqu-agent-cli
        run: |
          set -euo pipefail
          TGZ_PATH="${{ steps.pack.outputs.tgz_path }}"
          BASE=$(basename "$TGZ_PATH")
          (cd "$RUNNER_TEMP/cli-assets" && shasum -a 256 "$BASE" > "$BASE.sha256")
          (cd "$RUNNER_TEMP/cli-assets" && shasum -a 256 -c "$BASE.sha256")
          cat "$RUNNER_TEMP/cli-assets/$BASE.sha256"

      - name: Tarball content contract
        working-directory: packages/panqu-agent-cli
        run: |
          set -euo pipefail
          TGZ_PATH="${{ steps.pack.outputs.tgz_path }}"
          if tar -tzf "$TGZ_PATH" | grep -E '(^|/)(tests?|__tests__|node_modules|\.env|coverage|\.git)/'; then
            echo "ERROR: tarball contains forbidden entries"; exit 1
          fi
          echo "tarball content contract OK"

      - name: Upload CLI release assets (tgz + sha256)
        uses: actions/upload-artifact@v4
        with:
          name: panqu-agent-cli-release-assets
          path: ${{ runner.temp }}/cli-assets/
          retention-days: 30
          if-no-files-found: error

  # ════════════════════════════════════════════
  # 部署到测试环境 + 冒烟测试
  # ════════════════════════════════════════════
  deploy-test:
    needs: [release-image, cli-assets]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: test
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.run_id }}
          path: security-reports/

      - name: Validate deploy configuration (fail closed)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          missing=""
          [ -n "${DEPLOY_HOST}" ] || missing="${missing} DEPLOY_HOST"
          [ -n "${DEPLOY_USER}" ] || missing="${missing} DEPLOY_USER"
          [ -n "${DEPLOY_SSH_KEY}" ] || missing="${missing} DEPLOY_SSH_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::deploy secrets not configured (fail closed):${missing}"
            exit 1
          fi
          echo "deploy configuration present (fail closed check passed)"

      - name: Deploy to test server
        id: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOY_IMAGE=$(cat security-reports/published-image.txt)
          echo "Deploying: $DEPLOY_IMAGE"

          # Setup SSH
          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

          # Execute deploy script on test server
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" \
            DEPLOY_IMAGE="$DEPLOY_IMAGE" \
            REGISTRY="$REGISTRY" \
            REGISTRY_USER="$REGISTRY_USER" \
            REGISTRY_PASSWORD="$REGISTRY_PASSWORD" \
            "bash -s" < scripts/deploy/deploy.sh

          # Read deploy status
          if [ -f security-reports/deploy-status.json ]; then
            STATUS=$(python3 -c "import json; print(json.load(open('security-reports/deploy-status.json')).get('status','unknown'))" 2>/dev/null || echo "unknown")
            echo "status=$STATUS" >> $GITHUB_OUTPUT
          fi

      - name: Upload deploy status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-status-${{ github.run_id }}
          path: security-reports/
          retention-days: 30

  # ════════════════════════════════════════════
  # 发布通知（飞书）
  # ════════════════════════════════════════════
  notify:
    needs: [deploy-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download deploy status
        uses: actions/download-artifact@v4
        with:
          name: deploy-status-${{ github.run_id }}
          path: security-reports/
        continue-on-error: true

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK: ${{ secrets.TESTFLOW_FEISHU_WEBHOOK }}
          RELEASE_STATUS: ${{ needs.deploy-test.result }}
          CLI_ASSETS_STATUS: ${{ needs.cli-assets.result }}
          RELEASE_IMAGE: ${{ needs.release-image.outputs.digest-ref }}
          RELEASE_TAG: ${{ needs.release-image.outputs.image-tag }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          PIPELINE_ID: ${{ github.run_id }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_ENV: test
          SMOKE_RESULT: ${{ needs.deploy-test.result }}
        run: node scripts/deploy/notify-feishu.mjs || echo "Notification failed, not blocking"
